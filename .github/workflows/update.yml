name: Update libyear info

on:
  schedule:
    - cron:  '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Update data
      uses: Dependency-Drift-Tracker/dependency-drift-tracker-action@7df80e5c62257c330033a683a44cdd52145c39fb # v1
      with:
        command: update-data
        secrets: ${{ toJSON(secrets) }}
